[project]
name = "medikiosk-module-a"
version = "0.1.0"
description = "Module A — Conversational Multimodal History Engine (Pipecat)"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "loguru>=0.7.0",
  "pipecat-ai[cartesia,deepgram,openai,silero,webrtc]>=0.0.92",
  "psycopg[binary,pool]>=3.2.0",
  "requests>=2.32.0",
  "google-generativeai>=0.8.0",
  "pillow>=10.0.0",
  "boto3>=1.35.0",
  "python-multipart>=0.0.18",
  "langchain-groq>=1.1.3",
  "groq>=0.37.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
